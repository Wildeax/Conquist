name: Conquist checks
on:
  push:
    branches: [main, develop]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run build:vps
      - name: Validate deployment scripts
        working-directory: .
        run: |
          bash -n deploy/actions/receive.sh deploy/actions/smoke-release.sh
          shellcheck deploy/actions/receive.sh deploy/actions/smoke-release.sh
          python3 -m unittest discover -s deploy/actions -p '*_test.py'
