name: Conquist checks
on:
  push:
    branches: [main, develop]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run build:vps
      - name: Validate deployment scripts
        working-directory: .
        run: |
          bash -n deploy/actions/receive.sh deploy/actions/smoke-release.sh
          shellcheck deploy/actions/receive.sh deploy/actions/smoke-release.sh
          python3 -m unittest discover -s deploy/actions -p '*_test.py'
