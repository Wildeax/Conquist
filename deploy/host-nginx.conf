# Shared-box vhost. Never make this a default_server.
server {
    listen 80;
    listen [::]:80;
    server_name conquist.online;
    return 301 https://conquist.online$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name conquist.online;
    ssl_certificate /etc/nginx/ssl/conquist/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/conquist/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ConquistTLS:1m;
    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }
}
