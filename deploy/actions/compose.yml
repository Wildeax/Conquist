# Installed root-owned on the VPS. Environment and release are set by receive.sh.
name: ${CONQUIST_PROJECT:?}
services:
  web:
    image: conquist-web:${CONQUIST_RELEASE:?}
    restart: unless-stopped
    depends_on:
      rooms:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CONQUIST_PORT:?}:8080"
    mem_limit: 128m
    cpus: 1.0
    pids_limit: 100
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  rooms:
    image: conquist-rooms:${CONQUIST_RELEASE:?}
    user: node
    restart: unless-stopped
    volumes:
      - rooms-data:/data
    environment:
      CONQUIST_DATA_DIR: /data
      CONQUIST_RELEASE: ${CONQUIST_RELEASE:?}
      CONQUIST_ENVIRONMENT: ${CONQUIST_ENVIRONMENT:?}
      PORT: 3102
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 100
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
volumes:
  rooms-data:
